version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci # or yarn install
    build:
      commands:
        - npm run build # or yarn build
  artifacts:
    # IMPORTANT: This tells Amplify what to deploy
    baseDirectory: .next # Use 'dist', 'build', or 'out' depending on your framework
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*